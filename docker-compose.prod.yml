services:
  postgres:
    image: postgres:16-alpine
    container_name: flight-menu-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-flight_menu}
      POSTGRES_USER: ${DB_USERNAME:-flight_menu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flight_menu}
    volumes:
      - postgres_flight_menu_prod:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-flight_menu} -d ${DB_NAME:-flight_menu}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: flight-menu-api:prod
    container_name: flight-menu-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: prod
      DEBUG: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  postgres_flight_menu_prod:
