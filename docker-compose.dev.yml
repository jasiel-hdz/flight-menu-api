services:
  postgres:
    image: postgres:16-alpine
    container_name: flight-menu-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-flight_menu}
      POSTGRES_USER: ${DB_USERNAME:-flight_menu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flight_menu}
    ports:
      - "5435:5432"
    volumes:
      - postgres_flight_menu_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-flight_menu} -d ${DB_NAME:-flight_menu}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_flight_menu_dev:
